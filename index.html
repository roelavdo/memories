<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Roel Memories</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Hanken+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: photos touch each other at full height on a plain page and scroll freely sideways; phones stack them. Menu and footer are small mono text floating over the photos. */
:root{
  --bg:#FFFFFF; --surface:#EFEFEF; --ink:#111111; --muted:#6B6B6B; --line:#DADADA;
  --accent:#111111; --accent-ink:#FFFFFF;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0C0C10; --surface:#17171D; --ink:#F1EDE4; --muted:#9A968C; --line:#2B2B34;
  --accent:#F1EDE4; --accent-ink:#0C0C10; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{
  height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55; overflow:hidden;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}

/* menu and footer: small text that stays readable on any photo */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;color:#fff;mix-blend-mode:difference;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) clamp(16px,3vw,40px) 0}
.bar-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.bar a,.bar button{pointer-events:auto;color:inherit;text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer}
.bar a:hover,.bar button:hover{text-decoration:underline}
.bar .mid{text-align:center}
.bar .end{text-align:right}
.foot{position:fixed;right:clamp(16px,3vw,40px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:20;color:#fff;mix-blend-mode:difference;pointer-events:none}
.prog{display:none}

/* strip */
.strip{position:fixed;inset:0;display:flex;flex-direction:column;gap:0;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;scrollbar-width:none;background:var(--bg)}
.strip::-webkit-scrollbar{display:none}
.photo{position:relative;display:block;flex:none;width:100%;padding:0;border:0;background:var(--surface);color:#fff;
  cursor:pointer;text-align:left;overflow:hidden}
.photo img{display:block;width:100%;height:auto}
.photo .cap{position:absolute;left:0;bottom:0;display:flex;flex-direction:column;gap:2px;pointer-events:none;color:#fff;mix-blend-mode:difference;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
.cap b{font-family:var(--f-display);font-weight:500;font-size:clamp(1.1rem,1.6vw,1.5rem);line-height:1.1}
.photo.plain{aspect-ratio:4/5}
.photo .day{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-style:italic;
  font-size:clamp(8rem,22vw,16rem);line-height:.8;color:var(--line);font-variant-numeric:tabular-nums;pointer-events:none}
.empty{flex:none;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:0;
  padding:0 clamp(16px,3vw,40px);color:var(--ink)}
.empty h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2.6rem,8vw,6rem);line-height:1;margin:0 0 16px;letter-spacing:-.01em}
.empty p{color:var(--muted);margin:0 0 22px;max-width:28rem}
@media (min-width:821px){
  .strip{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:stretch;
    padding-inline:clamp(16px,2.7vw,52px);scrollbar-width:thin;scrollbar-color:#8a8a8a var(--bg)}
  .strip::-webkit-scrollbar{display:block;height:12px}
  .strip::-webkit-scrollbar-thumb{background:#8a8a8a}
  .strip::-webkit-scrollbar-track{background:var(--bg)}
  .photo{width:auto;height:100%}
  .photo img{height:100%;width:auto;max-width:none}
  .empty{width:100vw;margin-inline:calc(-1*clamp(16px,2.7vw,52px))}
}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(6,6,9,.82);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:clamp(12px,4vw,48px)}
.sheet[hidden]{display:none!important}
.paper{background:var(--bg);border:1px solid var(--line);max-width:860px;width:100%;position:relative}
.paper img{display:block;max-width:100%;max-height:82vh;width:auto;height:auto;margin:0 auto 4px;background:var(--surface)}
.paper .body{padding:clamp(18px,3.4vw,40px)}
.paper h2{font-family:var(--f-display);font-weight:500;font-size:clamp(2rem,5vw,3.4rem);line-height:1;margin:10px 0 0}
.meta{display:flex;gap:6px 22px;flex-wrap:wrap;color:var(--muted);margin-top:14px}
.story{margin-top:24px;white-space:pre-wrap;max-width:40rem;font-size:1.05rem;overflow-wrap:anywhere}
.close{position:absolute;top:10px;right:10px;background:var(--bg);border:1px solid var(--line);padding:6px 12px;cursor:pointer;z-index:2}
.danger{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline}
.sure{background:var(--ink);color:var(--bg);border:0;padding:8px 16px;cursor:pointer}

/* owner portal */
.portal{position:fixed;top:0;bottom:0;right:0;z-index:40;width:min(460px,100%);background:var(--bg);border-left:1px solid var(--line);
  overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) clamp(16px,3vw,28px) calc(env(safe-area-inset-bottom,0px) + 28px)}
.portal[hidden]{display:none!important}
.portal h2{font-family:var(--f-display);font-weight:500;font-size:2.2rem;line-height:1;margin:0}
.portal .top{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:6px}
.portal p{color:var(--muted);margin:10px 0 24px}
form{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
label{color:var(--muted)}
input[type=text],input[type=date],textarea{background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;border-radius:0;width:100%;min-width:0}
input[type=text]:focus,input[type=date]:focus,textarea:focus{outline:none;border-bottom-color:var(--accent)}
textarea{resize:vertical;min-height:7.5rem}
input[type=file]{max-width:100%;color:var(--muted)}
.go{background:var(--accent);color:var(--accent-ink);border:0;padding:13px 26px;cursor:pointer;font-weight:600;letter-spacing:.04em}
.go:disabled{opacity:.5;cursor:default}
.status{color:var(--muted)}
.status.err{color:var(--ink);font-weight:600}
.actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="bar mono"><div class="bar-in">
  <a href="#top" id="top">Roel</a>
  <span class="mid">Memories</span>
  <span class="end"><button id="theme" type="button" aria-label="Switch light or dark">Theme</button></span>
</div></div>
<div class="prog" aria-hidden="true"><i id="progbar"></i></div>
<div class="foot mono">Roel &copy;<span id="year"></span></div>

<main class="strip" id="strip" tabindex="0" aria-label="Memories"></main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Memory"></div>

<script>
(function(){
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var memories=[], loaded=false, loadError=false, openId=null;
  var $=function(s){return document.querySelector(s)};
  var desk=function(){return window.matchMedia("(min-width: 821px)").matches};

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
  function short(s){var p=pd(s);return p?p.d+" "+MONTHS[p.m-1]+" "+p.y:"Undated"}
  function pad(n,w){n=String(n);while(n.length<w)n="0"+n;return n}
  function pics(m){var a=Array.isArray(m.photos)?m.photos:[];if(!a.length&&typeof m.photo==="string"&&m.photo)a=[m.photo];return a.filter(function(u){return typeof u==="string"&&u})}
  function imgTag(src,m,lazy){return '<img data-photo alt="'+esc(m.title)+'" decoding="async"'+(lazy?' loading="lazy"':'')+' src="'+esc(src)+'">'}

  /* entry numbers follow the calendar: oldest memory is No. 001 */
  function numbered(){
    var asc=memories.slice().sort(function(a,b){return (a.date||"")<(b.date||"")?-1:(a.date||"")>(b.date||"")?1:0});
    var map={};asc.forEach(function(m,i){map[m.id]=i+1});return map;
  }
  function wireImgs(root){
    root.querySelectorAll("img[data-photo]").forEach(function(im){
      im.addEventListener("error",function(){var p=im.parentElement;im.remove();if(p&&p.classList.contains("photo")){p.classList.add("plain")}});
    });
  }

  function renderStrip(nums){
    var el=$("#strip");
    if(!memories.length){
      var msg=loadError?'<h1>Not loading</h1><p>The memories could not be loaded. Reload the page to try again.</p>'
        :!loaded?'<h1>Opening</h1><p></p>'
        :'<h1>Coming soon</h1><p>Memories will appear here.</p>';
      el.innerHTML='<div class="empty">'+msg+'</div>';
      return;
    }
    var first=true;
    el.innerHTML=memories.map(function(m){
      var ps=pics(m), p=pd(m.date), n=Math.max(ps.length,1);
      var out="";
      for(var i=0;i<n;i++){
        var has=ps.length>0, count=n>1?' · '+n+' photos':'';
        out+='<button type="button" class="photo'+(has?'':' plain')+'" data-open="'+esc(m.id)+'">'+(has?imgTag(ps[i],m,false):"")+
          (has?'':'<span class="day" aria-hidden="true">'+(p?p.d:"")+'</span>')+
          (i===0?'<span class="cap"><span class="mono">No. '+pad(nums[m.id],3)+' · '+esc(short(m.date))+count+'</span><b>'+esc(m.title)+'</b></span>':'')+'</button>';
        first=false;
      }
      return out;
    }).join("");
    wireImgs(el);
  }

  function renderSheet(nums){
    var sh=$("#sheet");
    var m=memories.filter(function(x){return x.id===openId})[0];
    if(!m){sh.hidden=true;sh.innerHTML="";document.body.style.overflow="";return}
    var meta='<span>'+esc(short(m.date))+'</span>'+(m.place?'<span>'+esc(m.place)+'</span>':'')+(m.people?'<span>With '+esc(m.people)+'</span>':'');
    sh.innerHTML='<div class="paper"><button type="button" class="close mono" data-act="close">Close</button>'+pics(m).map(function(u){return imgTag(u,m,true)}).join("")+
      '<div class="body"><span class="mono" style="color:var(--accent)">Entry '+pad(nums[m.id],3)+'</span><h2>'+esc(m.title)+'</h2><div class="meta">'+meta+'</div>'+
      (m.story?'<div class="story">'+esc(m.story)+'</div>':'')+'</div></div>';
    sh.hidden=false;document.body.style.overflow="hidden";
    wireImgs(sh);
  }

  function renderAll(){var nums=numbered();renderStrip(nums);renderSheet(nums);updateProg()}

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-open],[data-act]");
    if(!t)return;
    if(t.dataset.open){openId=t.dataset.open;renderAll();var c=$("#sheet .close");if(c)c.focus();return}
    if(t.dataset.act==="close")closeSheet();
  });
  $("#sheet").addEventListener("click",function(e){if(e.target===e.currentTarget)closeSheet()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&openId)closeSheet()});
  function closeSheet(){openId=null;renderAll()}

  /* desktop: the wheel and arrow keys scroll the row sideways, freely */
  var strip=$("#strip");
  function behave(){return matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}
  function step(dir){
    if(desk())strip.scrollBy({left:dir*strip.clientWidth*0.6,behavior:behave()});
    else strip.scrollBy({top:dir*strip.clientHeight*0.6,behavior:behave()});
  }
  strip.addEventListener("wheel",function(e){
    if(!desk())return;
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();strip.scrollLeft+=e.deltaY}
  },{passive:false});
  document.addEventListener("keydown",function(e){
    if(openId)return;
    var k=e.key;
    if(k==="ArrowRight"||k==="ArrowDown"||k==="PageDown"||k===" "){e.preventDefault();step(1)}
    else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"){e.preventDefault();step(-1)}
  });
  strip.addEventListener("scroll",updateProg,{passive:true});
  window.addEventListener("resize",updateProg);
  function updateProg(){
    var d=desk(), max=d?strip.scrollWidth-strip.clientWidth:strip.scrollHeight-strip.clientHeight, pos=d?strip.scrollLeft:strip.scrollTop;
    $("#progbar").style.width=(max>0?Math.min(100,pos/max*100):0)+"%";
  }

  /* theme toggle: remembered in this browser only */
  (function(){
    var root=document.documentElement;
    try{var t=localStorage.getItem("roel-theme");if(t==="light"||t==="dark")root.setAttribute("data-theme",t)}catch(_){}
    $("#theme").addEventListener("click",function(){
      var cur=root.getAttribute("data-theme");
      if(!cur)cur="light";
      var nxt=cur==="dark"?"light":"dark";
      root.setAttribute("data-theme",nxt);
      try{localStorage.setItem("roel-theme",nxt)}catch(_){}
    });
  })();

  $("#year").textContent=new Date().getFullYear();
  renderAll();
  function getJson(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()})}
  var apiFailed=false;
  Promise.all([
    getJson("/api/memories").catch(function(){apiFailed=true;return []}),
    getJson("memories.json").catch(function(){return null})
  ]).then(function(r){
    if(r[1]===null&&apiFailed){loaded=true;loadError=true;renderAll();return}
    var fromApi=(Array.isArray(r[0])?r[0]:[]).filter(function(m){return m&&m.title}).map(function(m,i){m.id=String(m.id||("a"+i));return m});
    var fromFile=(Array.isArray(r[1])?r[1]:[]).filter(function(m){return m&&m.title}).map(function(m,i){m.id="f"+i;return m});
    memories=fromApi.concat(fromFile);
    memories.sort(function(a,b){return (a.date||"")<(b.date||"")?1:(a.date||"")>(b.date||"")?-1:0});
    loaded=true;renderAll();
  });
})();
</script>
</body>
</html>
